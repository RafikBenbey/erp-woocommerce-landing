<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Woo Relay - Pilotez votre WooCommerce en temps réel depuis Windows</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Librairie d'animations AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden">

    <!-- HEADER / HERO -->
    <header class="max-w-6xl mx-auto px-6 py-20 text-center">
        <span id="hero-badge" data-aos="fade-down" class="bg-emerald-500/10 text-emerald-400 text-sm font-semibold px-4 py-1.5 rounded-full border border-emerald-500/20 inline-block mb-6">
            Chargement...
        </span>
        <h1 id="hero-title" data-aos="fade-up" data-aos-delay="100" class="text-4xl md:text-6xl font-extrabold tracking-tight">
            Chargement...
        </h1>
        <p id="hero-desc" data-aos="fade-up" data-aos-delay="200" class="mt-6 text-lg md:text-xl text-slate-300 max-w-3xl mx-auto leading-relaxed">
            Chargement...
        </p>
        
        <!-- Emplacement image dynamique -->
        <div id="image-container" data-aos="zoom-in" data-aos-delay="300" class="mt-10 hidden">
            <img id="hero-img" src="" alt="Woo Relay Aperçu" class="mx-auto rounded-2xl shadow-2xl border border-slate-800 max-w-2xl w-full" />
        </div>

        <div class="mt-10" data-aos="fade-up" data-aos-delay="400">
            <a href="#contact" id="cta-btn" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-8 py-4 rounded-xl transition shadow-lg shadow-emerald-500/20 inline-block">
                Chargement...
            </a>
        </div>
    </header>

    <!-- SECTION CONTACT -->
    <section id="contact" data-aos="fade-up" class="max-w-2xl mx-auto px-6 py-16 my-12 bg-slate-900 rounded-3xl border border-slate-800 shadow-2xl">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold">Intéressé par Woo Relay ?</h2>
            <p class="text-slate-400 mt-2">Laissez vos coordonnées pour recevoir le logiciel.</p>
        </div>

        <form name="contact-woo-relay" method="POST" data-netlify="true" class="space-y-6">
            <input type="hidden" name="form-name" value="contact-woo-relay" />
            <div>
                <label class="block text-sm font-medium mb-2">Nom complet</label>
                <input type="text" name="nom" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="Votre nom" />
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">Téléphone / WhatsApp</label>
                <input type="tel" name="telephone" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="05XXXXXXXX" />
            </div>
            <div>
                <label class="block text-sm font-medium mb-2">URL de votre boutique WooCommerce</label>
                <input type="text" name="boutique_url" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-emerald-500" placeholder="https://mavoutique.com" />
            </div>
            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-4 rounded-xl transition shadow-lg">
                Demander mon accès
            </button>
        </form>
    </section>

    <!-- Scripts (Chargement des données JSON et animations AOS) -->
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        AOS.init({ duration: 800, once: true });

        fetch('content.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('hero-badge').innerText = data.hero_badge;
                document.getElementById('hero-title').innerText = data.hero_title;
                document.getElementById('hero-desc').innerText = data.hero_description;
                document.getElementById('cta-btn').innerText = data.cta_button;

                if (data.hero_image) {
                    document.getElementById('hero-img').src = data.hero_image;
                    document.getElementById('image-container').classList.remove('hidden');
                }
            });
    </script>
</body>
</html>
